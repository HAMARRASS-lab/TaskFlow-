services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: taskflow
      DB_USER: taskflow
      DB_PASSWORD: taskflow
      # Local dev only: same dev key as application.yml (an empty value would crash JwtService)
      JWT_SECRET: ${JWT_SECRET:-tvqKiWqs+0eEnyF6QWTljMFEYPCBDl0dcYOpuiDxzrzQ5NDYOtpiENx6i8c4NVLk}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://host.docker.internal:8081}
      FRONTEND_URL: http://localhost:8081
      # Every email lands in Mailpit: http://localhost:8025
      MAIL_ENABLED: "true"
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      # Admin assistant (chat bot), read from the git-ignored .env
      OPENAI_API_KEY: ${OPENAI_API_KEY:-not-set}
    ports:
      - "8080:8080"

  # Local SMTP server that catches every email (web UI on http://localhost:8025)
  mailpit:
    image: axllent/mailpit:v1.20
    ports:
      - "1025:1025"
      - "8025:8025"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "8081:80"

volumes:
  pgdata:
