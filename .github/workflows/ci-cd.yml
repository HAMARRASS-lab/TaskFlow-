name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend - build & JUnit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-reports
          path: |
            backend/target/surefire-reports
            backend/target/site/jacoco

  frontend:
    name: Frontend - Jest & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0
      - run: npm run test:ci
      - run: npm run build

  e2e:
    name: Frontend - Cypress
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Started and awaited here rather than with the Cypress action's start/wait-on, whose wait-on aborted
      # within seconds ("Socket closed before the connection was established") instead of retrying.
      # IPv4 pinned: "localhost" may resolve to ::1 for ng serve but 127.0.0.1 for the client (or vice versa).
      - name: Start the dev server
        run: |
          nohup npx ng serve --host 127.0.0.1 --port 4200 > ng-serve.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf -o /dev/null http://127.0.0.1:4200 && exit 0
            sleep 2
          done
          echo "Dev server did not start within 180s:"; cat ng-serve.log; exit 1
      - uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          install: false
          config: baseUrl=http://127.0.0.1:4200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: |
            frontend/cypress/screenshots
            frontend/ng-serve.log
