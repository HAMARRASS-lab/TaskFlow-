# Render Blueprint: https://render.com/docs/blueprint-spec
# New > Blueprint > select this repo. Creates PostgreSQL + API + web front.
databases:
  - name: taskflow-db
    plan: free
    databaseName: taskflow
    user: taskflow

services:
  - type: web
    name: taskflow-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /actuator/health
    autoDeploy: false   # deployed by GitHub Actions deploy hook after CI passes
    envVars:
      - key: DB_HOST
        fromDatabase: { name: taskflow-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: taskflow-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: taskflow-db, property: database }
      - key: DB_USER
        fromDatabase: { name: taskflow-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: taskflow-db, property: password }
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://taskflow-web.onrender.com

  - type: web
    name: taskflow-web
    runtime: docker
    rootDir: frontend
    plan: free
    autoDeploy: false
    envVars:
      - key: BACKEND_URL
        value: https://taskflow-api.onrender.com
