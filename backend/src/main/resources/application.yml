spring:
  application:
    name: taskflow-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskflow}
    username: ${DB_USER:taskflow}
    password: ${DB_PASSWORD:taskflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

app:
  jwt:
    # Base64-encoded HMAC key (>= 256 bits). ALWAYS override JWT_SECRET in production.
    secret: ${JWT_SECRET:tvqKiWqs+0eEnyF6QWTljMFEYPCBDl0dcYOpuiDxzrzQ5NDYOtpiENx6i8c4NVLk}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  admin:
    # Comma-separated emails granted the ADMIN role (at startup and on registration).
    emails: ${ADMIN_EMAILS:h.hamarrass1@gmail.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
