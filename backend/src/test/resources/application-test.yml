spring:
  datasource:
    url: jdbc:h2:mem:taskflow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  # never call OpenAI from tests, even if a real key is in the local .env
  ai:
    openai:
      api-key: not-set

app:
  admin:
    emails: admin@test.com
  digest:
    cron: "-"
